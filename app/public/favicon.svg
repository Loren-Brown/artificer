<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Artificer">
  <defs>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="1.4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <radialGradient id="ring" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F5D4" stop-opacity="0.35"/>
      <stop offset="70%" stop-color="#00B4D8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0B132B" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="32" height="32" rx="8" fill="#0B132B"/>
  <circle cx="16" cy="16" r="14" fill="url(#ring)"/>
  <!-- rune / gear circle -->
  <g fill="none" stroke="#00B4D8" stroke-width="1.25" filter="url(#glow)">
    <circle cx="16" cy="16" r="9.5"/>
    <circle cx="16" cy="16" r="6.5" stroke-dasharray="2.2 1.8"/>
  </g>
  <g fill="#00F5D4" filter="url(#glow)">
    <circle cx="16" cy="6.5" r="1.1"/>
    <circle cx="16" cy="25.5" r="1.1"/>
    <circle cx="6.5" cy="16" r="1.1"/>
    <circle cx="25.5" cy="16" r="1.1"/>
  </g>
  <!-- quill -->
  <g transform="rotate(-38 16 16)">
    <path
      fill="#F4F6F9"
      d="M15.2 7.2c2.8 1.2 5.6 4.2 6.4 7.2.2.8-.2 1.2-.8 1L15 13.8c-.5-.2-.7-.7-.5-1.2.6-1.8 1-3.6.7-5.4Z"
    />
    <path
      fill="#00F5D4"
      d="M14.6 14.2 12.8 24.5c-.1.6.5 1 .9.6l1.7-1.9c.2-.2.2-.5.1-.7l-.9-8.3Z"
    />
    <path
      fill="#8DA9C4"
      d="M15.4 8.4c.9 1.6 1.6 3.4 1.8 5.1l-1.6-.7c.1-1.5-.1-3-.2-4.4Z"
    />
  </g>
</svg>
